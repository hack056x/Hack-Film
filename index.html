<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hack Film 2.0 - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0c15;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            color: #fff;
        }

        .carousel-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .carousel-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 20px 0;
            transition: transform 0.1s linear;
            will-change: transform;
        }

        .poster {
            width: calc(20% - 20px);
            margin: 10px;
            position: relative;
            overflow: hidden;
            aspect-ratio: 2/3;
            cursor: default;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            pointer-events: none;
        }

        .poster:hover {
            transform: scale(1.08);
            z-index: 10;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }

        .poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 12px;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .poster-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            color: white;
            padding: 12px 8px 8px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 0 0 12px 12px;
            pointer-events: none;
        }

        .poster:hover .poster-title {
            opacity: 1;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .bg-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0,168,225,0.25) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
            filter: blur(40px);
        }

        .bg-blob:nth-child(1) { top: -100px; left: -100px; animation-delay: 0s; }
        .bg-blob:nth-child(2) { bottom: -150px; right: -100px; animation-delay: -5s; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0,200,210,0.2) 0%, transparent 70%);}
        .bg-blob:nth-child(3) { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; height: 600px; animation-delay: -10s; opacity: 0.3; background: radial-gradient(circle, rgba(100,100,255,0.15) 0%, transparent 70%);}

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(20, 28, 40, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
            animation: slideUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            width: 100%;
            transition: transform 0.2s;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00A8E1, #0086b3);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 12px 28px rgba(0,168,225,0.4);
        }

        .logo-icon i {
            font-size: 42px;
            color: white;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .logo h1 {
            color: #fff;
            font-size: 28px;
            letter-spacing: -0.3px;
            font-weight: 700;
        }

        .logo p {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            margin-top: 6px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.85);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .input-group label i {
            margin-right: 8px;
            color: #00A8E1;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(10, 14, 23, 0.7);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 18px;
            color: white;
            font-size: 16px;
            transition: all 0.25s ease;
            font-weight: 500;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00A8E1;
            box-shadow: 0 0 0 3px rgba(0,168,225,0.25);
            background: rgba(0,0,0,0.5);
        }

        .input-group input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.75);
            font-size: 14px;
            cursor: pointer;
        }

        .checkbox-group input {
            width: 16px;
            height: 16px;
            accent-color: #00A8E1;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(105deg, #00A8E1, #0077a3);
            border: none;
            border-radius: 28px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 18px rgba(0,168,225,0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 26px rgba(0,168,225,0.45);
            background: linear-gradient(105deg, #00b8f5, #008fc2);
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        .error-message {
            background: rgba(229, 9, 20, 0.2);
            border-left: 3px solid #e50914;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 22px;
            color: #ff8a92;
            text-align: center;
            font-size: 14px;
            display: none;
            backdrop-filter: blur(4px);
        }

        .demo-credentials {
            background: rgba(0,168,225,0.12);
            border-radius: 18px;
            padding: 14px;
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(0,168,225,0.3);
        }

        .demo-credentials i {
            margin-right: 5px;
            color: #00A8E1;
        }

        .demo-credentials span {
            color: #00e0ff;
            font-family: monospace;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
            padding: 2px 6px;
            border-radius: 8px;
            margin: 0 2px;
        }

        @media (max-width: 650px) {
            .poster { width: calc(33% - 20px); }
            .login-card { padding: 32px 24px; }
        }

        @media (max-width: 480px) {
            .poster { width: calc(50% - 20px); }
            .login-card { padding: 28px 20px; }
            .logo h1 { font-size: 24px; }
        }

        .login-card {
            background: rgba(15, 22, 36, 0.85);
            backdrop-filter: blur(18px);
        }
    </style>
</head>
<body>

    <div class="carousel-container">
        <div class="carousel-content" id="dynamicCarousel"></div>
    </div>

    <div class="bg-animation">
        <div class="bg-blob"></div>
        <div class="bg-blob"></div>
        <div class="bg-blob"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-play-circle"></i></div>
                <h1>Hack Film 2.0</h1>
                <p>Hackear Tu Vision</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form id="loginForm">
                <div class="input-group">
                    <label><i class="fas fa-user"></i> Usuario</label>
                    <input type="text" id="username" placeholder="Tu nombre de usuario" autocomplete="off">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-lock"></i> Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="rememberMe"> Recordarme en este equipo</label>
                </div>
                <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</button>
            </form>

            <div class="demo-credentials">
                <i class="fas fa-copyright"></i> 2026 Hack Film. Todos los derechos reservados.<br>
                Desarrollado por <span>@hacker056</span>
            </div>
        </div>
    </div>

    <script>
        const USERS_LIST_URL = 'https://raw.githubusercontent.com/hack056x/Hack-Film/refs/heads/main/usuario.txt';
        
        const moviesData = [
            { id: 1265609, title: "Máquina de guerra", img: "d5YmQx9kPLQBHEboGwrAavypztB.jpg" },
            { id: 875828, title: "Peaky Blinders", img: "l9S8MLUyi2diTc2Gf3KDAOQTuVx.jpg" },
            { id: 1159559, title: "Scream 7", img: "2pULHV2e3W7KNTyyfZl6dX071Np.jpg" },
            { id: 687163, title: "Proyecto Salvación", img: "7lwOTxajURKEWO6gI370NTrVdBO.jpg" },
            { id: 1290821, title: "Shelter", img: "kOsqd5jFZ0p3O8Z0k0VQvBW2neW.jpg" },
            { id: 1171145, title: "Ruta de escape", img: "wkmzt08vghSGlLYuqJpx4e2moRX.jpg" },
            { id: 840464, title: "Greenland 2", img: "q7aijAKE98Fcp6dgR6oWiUkFO2g.jpg" },
            { id: 1193501, title: "Whistle", img: "trmpaFGqzMBcy99PKbSDfRNTbf1.jpg" },
            { id: 680493, title: "Return to Silent Hill", img: "5Y2TeCVEnwPbd4FDShGbkKYw6GE.jpg" },
            { id: 1327819, title: "Hoppers", img: "4Z0E1W7YvQ0aVtgj7KKtktb9ukd.jpg" }
        ];

        let validUsers = {};
        let usersLoaded = false;

        function buildCarousel() {
            const container = document.getElementById('dynamicCarousel');
            if (!container) return;
            let html = '';
            const allMovies = [...moviesData, ...moviesData.slice(0, 70)];
            allMovies.forEach(movie => {
                const imgUrl = `https://image.tmdb.org/t/p/w500/${movie.img}`;
                html += `<div class="poster"><img src="${imgUrl}" alt="${movie.title}" loading="lazy" draggable="false"><div class="poster-title">${movie.title}</div></div>`;
            });
            container.innerHTML = html;
        }

        let scrollPosition = 0;
        let animationId = null;
        let carouselContent = null;

        function startCarouselScroll() {
            carouselContent = document.getElementById('dynamicCarousel');
            if (!carouselContent) return;
            function step() {
                if (!carouselContent) return;
                scrollPosition += 0.45;
                const maxScroll = carouselContent.scrollHeight / 2.2;
                if (scrollPosition >= maxScroll) scrollPosition = 0;
                carouselContent.style.transform = `translateY(-${scrollPosition}px)`;
                animationId = requestAnimationFrame(step);
            }
            if (animationId) cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(step);
        }

        async function loadUsers() {
            try {
                const response = await fetch(USERS_LIST_URL);
                if (!response.ok) return;
                
                const text = await response.text();
                let usersData;
                
                try {
                    usersData = JSON.parse(text);
                } catch (e) {
                    usersData = {};
                    const lines = text.split('\n');
                    for (let line of lines) {
                        line = line.trim();
                        if (line === '' || line.startsWith('#')) continue;
                        let username, password;
                        if (line.includes(':')) {
                            [username, password] = line.split(':');
                        } else if (line.includes(',')) {
                            [username, password] = line.split(',');
                        }
                        if (username && password) {
                            usersData[username.trim()] = password.trim();
                        }
                    }
                }
                
                if (usersData && Object.keys(usersData).length > 0) {
                    validUsers = usersData;
                    usersLoaded = true;
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        function checkAuth() {
            if (sessionStorage.getItem('loggedIn') === 'true') {
                window.location.href = 'dashboard.html';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            
            if (!username || !password) {
                errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Completa todos los campos';
                errorMsg.style.display = 'block';
                setTimeout(() => errorMsg.style.display = 'none', 3000);
                return;
            }
            
            if (!usersLoaded) {
                await loadUsers();
            }
            
            if (validUsers[username] === password) {
                if (document.getElementById('rememberMe').checked) {
                    localStorage.setItem('rememberedUser', username);
                } else {
                    localStorage.removeItem('rememberedUser');
                }
                sessionStorage.setItem('loggedIn', 'true');
                sessionStorage.setItem('username', username);
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Usuario o contraseña incorrectos';
                errorMsg.style.display = 'block';
                setTimeout(() => errorMsg.style.display = 'none', 3000);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            buildCarousel();
            startCarouselScroll();
            checkAuth();
            loadUsers();
            
            const remembered = localStorage.getItem('rememberedUser');
            if (remembered && document.getElementById('username')) {
                document.getElementById('username').value = remembered;
                document.getElementById('rememberMe').checked = true;
            }
            
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
        });
        
        window.addEventListener('beforeunload', () => {
            if (animationId) cancelAnimationFrame(animationId);
        });
    </script>
</body>
</html>
